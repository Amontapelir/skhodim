    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

         native form controls, scrollbars etc. based on the system theme. -->

    <title>Сходим?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- MAX Bridge — https://dev.max.ru/docs/webapps/bridge. Populates
         window.WebApp; harmless no-op outside a real MAX client (falls back
         to dev defaults, see src/maxBridge.ts). -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
