databases:
  - name: skhodim-db
    plan: free
    databaseName: skhodim
    user: skhodim

services:
  - type: web
    name: skhodim-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    # migrate и seed идемпотентны (seed пропускает пересев, если events уже
    # заполнены — см. server/src/db/seed.ts), seed-dev-users.ts тоже не
    # плодит дубли. Безопасно запускать при каждом старте, в том числе после
    # пробуждения бесплатного инстанса из сна.
    startCommand: npm run migrate && npm run seed && npx tsx scripts/seed-dev-users.ts && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skhodim-db
          property: connectionString
      - key: EVENT_SOURCE
        value: test
      - key: BOT_ADAPTER
        value: mock
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    runtime: static
    name: skhodim-miniapp
    rootDir: miniapp
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # После первого деплоя backend’а подставьте сюда реальный URL
      # (https://skhodim-server.onrender.com) и передеплойте static site —
      # Render Blueprint не умеет линковать полный URL веб-сервиса в build-time
      # переменную другого сервиса автоматически.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_YANDEX_MAPS_API_KEY
        sync: false
